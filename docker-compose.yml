services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: system15
      POSTGRES_DB: whatsapp_bot           # <-- ya crea la DB en bootstrap si el volumen es nuevo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts de inicialización (solo la primera vez que el volumen está vacío)
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Crea la DB si el volumen ya existía y no se ejecutan los scripts de init
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -lc "
      psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'whatsapp_bot'\" | grep -q 1
      || createdb -h postgres -U postgres whatsapp_bot
      "
    environment:
      PGPASSWORD: system15
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: whatsapp_gemini_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WEB_PORT: 3000
      SESSION_SECRET: whatsapp-bot-super-secret-key-change-in-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}   # ponla en tu .env del host si prefieres
      DATABASE_URL: postgresql://postgres:system15@postgres:5432/whatsapp_bot?schema=public
      BAILEYS_AUTH_DIR: /app/storage/baileys
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage:
