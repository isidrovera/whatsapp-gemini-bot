services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: system15
      POSTGRES_DB: whatsapp_bot
      TZ: America/Lima
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["simple", "proxy"]

  # ⛏️ Bootstrap de tablas directo desde schema.prisma
  # Cuando generes migraciones, cambia este command por:
  #   ["npx","prisma","migrate","deploy"]
  migrate:
    build:
      context: .
      target: runner
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    profiles: ["simple", "proxy"]

  # Modo simple (expone 3000)
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      WEB_PORT: "3000"
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ./baileys_auth:/app/baileys_auth
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["simple"]

  # Producción detrás de Nginx/HTTPS (no expone 3000)
  app_proxy:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      WEB_PORT: "3000"
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - webnet
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
    profiles: ["proxy"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app_proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem:ro
    networks:
      - webnet
    profiles: ["proxy"]

volumes:
  db_data:

networks:
  webnet:
    driver: bridge
