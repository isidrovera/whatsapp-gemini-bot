services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system15}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_bot}
      TZ: ${TZ:-America/Lima}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Si necesitas acceder desde el host (DBeaver/psql), publica un puerto único por instancia:
    # El valor por defecto 5470 evita colisiones con otros stacks.
    ports:
      - "${DB_HOST_PORT:-5470}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["simple", "proxy"]

  # Bootstrap del esquema Prisma (cámbialo a migrate deploy si ya gestionas migraciones)
  migrate:
    build:
      context: .
      target: runner
    restart: "no"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    # Para desarrollo rápido (crea/ajusta tablas a partir del schema.prisma)
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    # Para producción con migraciones versionadas, usa en su lugar:
    # command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["simple", "proxy"]

  # Modo simple: expone 3000 directamente
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-America/Lima}
      WEB_PORT: ${WEB_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - baileys_auth_data:/app/baileys_auth
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["simple"]

  # Modo proxy: no expone 3000; lo atiende Nginx por 80/443
  app_proxy:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-America/Lima}
      WEB_PORT: ${WEB_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - webnet
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["proxy"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app_proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem:ro
    networks:
      - webnet
    profiles: ["proxy"]

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-gemini}_db_data
  baileys_auth_data:
    name: ${COMPOSE_PROJECT_NAME:-gemini}_baileys_auth
networks:
  webnet:
    driver: bridge
